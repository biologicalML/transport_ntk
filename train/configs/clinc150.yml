# Camera-ready config for `clinc150`, ported from al_clinc150pca8_s.yml with the data
# and embedding paths rewritten to this package's ./data/clinc150/.
model:
  method: monge

  fitting_loss:
    name: sinkhorn

  regularizer:
    name: monge
    kwargs:
      cost: euclidean

  optim:
    lr: 5.0e-5
    name: adamw
    grad_acc_steps: 1
    kwargs:
      weight_decay: 1.0e-5

  mlp:
    dim_hidden: [64, 64, 32]
    dim_data: 8
    context_entity_bonds:
    - [0, 8]
    dim_cond: 64
    dim_cond_map: 64

  embedding:
    name: moa
    model_dir: ./data/clinc150/
    checkpoint: true
    dose_split: false

  num_train_iters: 100
  seed: 41


data:
   name: clinc150pca8
   file_path: ./data/clinc150/clinc150.h5ad
   batch_size: 256
   split: [0.8, 0.2, 0.0]
   drug_col: label
   drug_condition: translate
   control_condition: CTRL
   seed: 42

condition:
  mode: extrapolate
  split: [0.8, 0.2, 0.0]
