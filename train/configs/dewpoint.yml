# Camera-ready config for `dewpoint`, ported from al_dewp_s.yml with the data
# and embedding paths rewritten to this package's ./data/dewpoint/.
model:
  method: monge

  fitting_loss:
    name: sinkhorn

  regularizer:
    name: monge
    kwargs:
      cost: euclidean

  optim:
    lr: 1.0e-2
    name: adamw
    grad_acc_steps: 100
    kwargs:
      weight_decay: 1.0e-5

  mlp:
    dim_hidden: [64, 64, 32]
    dim_data: 1
    context_entity_bonds:
    - [0,3]
    dim_cond: 3
    dim_cond_map: 3

  embedding:
    name: moa
    model_dir: ./data/dewpoint/
    checkpoint: true
    dose_split: false

  num_train_iters: 100
  seed: 42


data:
   name: dewpoint
   file_path: ./data/dewpoint/dewpoint.h5ad
   batch_size: 128
   split: [0.8, 0.2, 0.0]
   drug_col: station
   drug_condition: s1047099999
   control_condition: CTRL
   seed: 42

condition:
  mode: extrapolate
  split: [0.8, 0.2, 0.0]
