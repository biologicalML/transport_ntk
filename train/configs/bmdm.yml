# Camera-ready config for `bmdm`, ported from al_ebmocavi2-10_s.yml with the data
# and embedding paths rewritten to this package's ./data/bmdm/.
model:
  method: monge

  fitting_loss:
    name: sinkhorn

  regularizer:
    name: monge
    kwargs:
      cost: euclidean
      #epsilon: 0.1

  optim:
    lr: 1.0e-2
    name: adamw
    grad_acc_steps: 100
    kwargs:
      weight_decay: 1.0e-5

  mlp:
    dim_hidden: [64, 64, 32]
    dim_data: 10
    context_entity_bonds:
    - [0,70] # [0, 194], [0, 195] for RDKit
    dim_cond: 70 # 195 for RDKit
    dim_cond_map: 70

  embedding:
    name: moa
    model_dir: ./data/bmdm/
    checkpoint: true
    dose_split: false

  num_train_iters: 100
  seed: 42


data:
   name: ebmocavi2-10
   file_path: ./data/bmdm/bmdm.h5ad
   batch_size: 256
   split: [0.8, 0.2, 0.0]
   drug_col: perturb_DE
   drug_condition: Jak1
   control_condition: Control
   seed: 42

condition:
  mode: extrapolate
  split: [0.8, 0.2, 0.0]
