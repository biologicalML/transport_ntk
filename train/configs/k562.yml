# Camera-ready config for `k562`, ported from al_sciplex_k562_full_s.yml with the data
# and embedding paths rewritten to this package's ./data/k562/.
model:
  method: monge

  fitting_loss:
    name: sinkhorn

  regularizer:
    name: monge
    kwargs:
      cost: euclidean

  optim:
    lr: 1.0e-3
    name: adamw
    grad_acc_steps: 100
    kwargs:
      weight_decay: 1.0e-5

  mlp:
    dim_hidden: [64, 64, 32]
    dim_data: 10
    context_entity_bonds:
    - [0,10]
    - [0,11]
    dim_cond: 11
    dim_cond_map: 10

  embedding:
    name: moa
    model_dir: ./data/k562/
    checkpoint: true

  num_train_iters: 100
  seed: 42


data:
   name: sciplex
   file_path: ./data/k562/k562.h5ad
   batch_size: 256
   split: [0.8, 0.2, 0.0]
   drug_col: drug-dose
   drug_condition: meprednisone-10000
   control_condition: control-0
   seed: 42

condition:
  mode: extrapolate
  split: [0.8, 0.2, 0.0]
