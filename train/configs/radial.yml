# Camera-ready config for `radial`, ported from al_ring2_s.yml with the data
# and embedding paths rewritten to this package's ./data/radial/.
model:
  method: monge

  fitting_loss:
    name: sinkhorn

  regularizer:
    name: monge
    kwargs:
      cost: euclidean

  optim:
    lr: 1.0e-2
    name: adamw
    grad_acc_steps: 100
    kwargs:
      weight_decay: 1.0e-5

  mlp:
    dim_hidden: [64, 64, 32]
    dim_data: 2
    context_entity_bonds:
    - [0, 2]
    dim_cond: 2
    dim_cond_map: 2

  embedding:
    name: moa
    model_dir: ./data/radial/
    checkpoint: true
    dose_split: false

  num_train_iters: 100
  seed: 42


data:
   name: ring2
   file_path: ./data/radial/radial.h5ad
   batch_size: 256
   split: [0.8, 0.2, 0.0]
   drug_col: condition
   drug_condition: cond0
   control_condition: control
   seed: 42

condition:
  mode: extrapolate
  split: [0.8, 0.2, 0.0]
